spring.application.name=safemove-backend

# Banco: H2 em memória por padrão (dev). Para Oracle, use o profile "oracle".
spring.datasource.url=jdbc:h2:mem:safemove;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Autenticação (emitida e validada pelo próprio backend, HS256).
# Em produção defina JWT_SECRET com 32+ caracteres.
safemove.jwt.secret=${JWT_SECRET:dev-only-secret-troque-em-producao-32b}
safemove.jwt.expiracao-horas=24

# Origens permitidas (CORS), separadas por vírgula. Apps nativos não usam CORS.
safemove.cors.origens=${CORS_ORIGENS:http://localhost:8081,http://localhost:19006}
