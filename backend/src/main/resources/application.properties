spring.application.name=safemove-backend

# Lê backend/.env (se existir) quando o app roda a partir de backend/.
spring.config.import=optional:file:.env[.properties]

# Perfil padrão: Oracle. Para H2 em memória, ative o perfil "dev".
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Autenticação: o backend fala com o Firebase Authentication (chaves em backend/.env).
# FIREBASE_API_KEY  = "Chave de API da Web" (Configurações do projeto > Geral)
# FIREBASE_PROJECT_ID = "ID do projeto"
safemove.firebase.api-key=${FIREBASE_API_KEY:}
safemove.firebase.project-id=${FIREBASE_PROJECT_ID:}

# TomTom (mapas/trânsito): a chave fica só no backend, em backend/.env.
safemove.tomtom.api-key=${TOMTOM_API_KEY:}

# Origens permitidas (CORS), separadas por vírgula. Apps nativos não usam CORS.
safemove.cors.origens=${CORS_ORIGENS:http://localhost:8081,http://localhost:19006}

# Áreas de risco: CSV com roubos e furtos por distrito da SSP-SP (distrito;mes;roubos;furtos).
# Opcional: sem ele, o risco usa só os assaltos reportados no app nos últimos 30 dias.
safemove.areas-risco.estatisticas-csv=${SSP_ESTATISTICAS_CSV:}
